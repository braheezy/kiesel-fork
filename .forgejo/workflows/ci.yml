name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # NOTE:
  # - The `fast` builds are being used for benchmarking, `safe` is noticeably slower
  #   - https://boajs.dev/benchmarks/
  #   - https://ahaoboy.github.io/js-engine-benchmark/
  # - This is split into multiple build jobs to have some level of parallelization. Ideally that
  #   would be fully handled in the Zig build system, which has proven difficult so far.
  #   See: https://codeberg.org/kiesel-js/kiesel/issues/103
  build-linux:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 10240 # 10 GiB
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,arm-unknown-linux-musleabihf,i686-unknown-linux-musl,loongarch64-unknown-linux-musl,powerpc64-unknown-linux-musl,riscv64gc-unknown-linux-musl,x86_64-unknown-linux-musl
      - name: Build kiesel-linux-aarch64
        run: |
          # Verify building without NaN-boxing on aarch64.
          zig build -Dtarget=aarch64-linux-musl -Doptimize=safe -Denable-nan-boxing=false
          zig build -Dtarget=aarch64-linux-musl -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-aarch64
      - name: Build kiesel-linux-aarch64 (fast)
        run: |
          zig build -Dtarget=aarch64-linux-musl -Doptimize=fast
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-aarch64-releasefast
      - name: Build kiesel-linux-arm
        run: |
          zig build -Dtarget=arm-linux-musleabihf -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-arm
      - name: Build kiesel-linux-loongarch64
        run: |
          zig build -Dtarget=loongarch64-linux-musl -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-loongarch64
      - name: Build kiesel-linux-mips
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=mips-linux-musleabi -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-mips
      - name: Build kiesel-linux-mips64
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=mips64-linux-muslabi64 -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-mips64
      - name: Build kiesel-linux-powerpc
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=powerpc-linux-musleabihf -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-powerpc
      - name: Build kiesel-linux-powerpc64
        run: |
          zig build -Dtarget=powerpc64-linux-musl -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-powerpc64
      - name: Build kiesel-linux-riscv64
        run: |
          zig build -Dtarget=riscv64-linux-musl -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-riscv64
      - name: Build kiesel-linux-s390x
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=s390x-linux-musl -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-s390x
      - name: Build kiesel-linux-x86
        run: |
          zig build -Dtarget=x86-linux-musl -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-x86
      - name: Build kiesel-linux-x86_64
        run: |
          # Verify building without NaN-boxing on x86_64.
          zig build -Dtarget=x86_64-linux-musl -Doptimize=safe -Denable-nan-boxing=false
          zig build -Dtarget=x86_64-linux-musl -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-x86_64
      - name: Build kiesel-linux-x86_64 (fast)
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=fast
          mv zig-out/bin/kiesel zig-out/bin/kiesel-linux-x86_64-releasefast
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-linux
          path: zig-out/bin/*

  build-macos:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096 # 4 GiB
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build kiesel-macos-aarch64
        run: |
          zig build -Dtarget=aarch64-macos-none -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-macos-aarch64
      - name: Build kiesel-macos-aarch64 (fast)
        run: |
          zig build -Dtarget=aarch64-macos-none -Doptimize=fast
          mv zig-out/bin/kiesel zig-out/bin/kiesel-macos-aarch64-releasefast
      - name: Build kiesel-macos-x86_64
        run: |
          zig build -Dtarget=x86_64-macos-none -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-macos-x86_64
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-macos
          path: zig-out/bin/*

  build-windows:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096 # 4 GiB
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-gnullvm,i686-pc-windows-gnu,x86_64-pc-windows-gnu
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64
      - name: Build kiesel-windows-aarch64.exe
        run: |
          zig build -Dtarget=aarch64-windows-gnu -Doptimize=safe
          mv zig-out/bin/kiesel.exe zig-out/bin/kiesel-windows-aarch64.exe
      - name: Build kiesel-windows-x86.exe
        run: |
          zig build -Dtarget=x86-windows-gnu -Doptimize=safe
          mv zig-out/bin/kiesel.exe zig-out/bin/kiesel-windows-x86.exe
      - name: Build kiesel-windows-x86_64.exe
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=safe
          mv zig-out/bin/kiesel.exe zig-out/bin/kiesel-windows-x86_64.exe
      - name: Build kiesel-windows-x86_64.exe (fast)
        run: |
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=fast
          mv zig-out/bin/kiesel.exe zig-out/bin/kiesel-windows-x86_64-releasefast.exe
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-windows
          path: zig-out/bin/*

  build-freebsd:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096 # 4 GiB
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd
      - name: Build kiesel-freebsd-aarch64
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=aarch64-freebsd-none -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-freebsd-aarch64
      - name: Build kiesel-freebsd-x86_64
        run: |
          zig build -Dtarget=x86_64-freebsd-none -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-freebsd-x86_64
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-freebsd
          path: zig-out/bin/*

  build-netbsd:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096 # 4 GiB
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-netbsd
      - name: Build kiesel-netbsd-aarch64
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=aarch64-netbsd-none -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-netbsd-aarch64
      - name: Build kiesel-netbsd-x86
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=x86-netbsd-none -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-netbsd-x86
      - name: Build kiesel-netbsd-x86_64
        run: |
          zig build -Dtarget=x86_64-netbsd-none -Doptimize=safe
          mv zig-out/bin/kiesel zig-out/bin/kiesel-netbsd-x86_64
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-netbsd
          path: zig-out/bin/*

  build-openbsd:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096 # 4 GiB
      - name: Build kiesel-openbsd-aarch64
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=aarch64-openbsd-none -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-openbsd-aarch64
      - name: Build kiesel-openbsd-x86
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=x86-openbsd-none -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-openbsd-x86
      - name: Build kiesel-openbsd-x86_64
        run: |
          # No prebuilt rust-std, build without Intl/Temporal
          zig build -Dtarget=x86_64-openbsd-none -Doptimize=safe -Denable-intl=false -Denable-temporal=false
          mv zig-out/bin/kiesel zig-out/bin/kiesel-openbsd-x86_64
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-openbsd
          path: zig-out/bin/*

  build-wasm:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096 # 4 GiB
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Build kiesel.wasm
        run: |
          # Building with Intl and Temporal adds nearly 10MB to the binary, so we build it twice:
          # - `safe` with everything enabled to ensure it keeps building
          # - `small` with Intl and Temporal disabled for the published binary
          zig build -Dtarget=wasm32-wasi -Doptimize=safe
          zig build -Dtarget=wasm32-wasi -Doptimize=small -Denable-intl=false -Denable-temporal=false
          # Outputs zig-out/bin/kiesel.wasm, no `mv` needed
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-wasm
          path: zig-out/bin/*

  upload-files:
    if: ${{ forgejo.ref_name == 'main' }}
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-freebsd
      - build-openbsd
      - build-wasm
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Download artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: files
          pattern: build-*
          merge-multiple: true
      - name: Upload files
        run: |
          echo "$FORGEJO_SHA" > files/version.txt
          for file in files/*; do
            curl \
              -u "${{ secrets.ARTIFACT_UPLOAD_USER }}:${{ secrets.ARTIFACT_UPLOAD_PASSWORD }}" \
              -F "path=@$file" \
              "https://files.kiesel.dev/upload?path=/files"
          done

  docs:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096 # 4 GiB
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mandoc
      - name: Build API docs
        run: |
          zig build docs
      - name: Build manual
        run: |
          mandoc -Thtml docs/kiesel.1 > zig-out/docs/kiesel.1.html
      - name: Upload files
        if: ${{ github.ref_name == 'main' }}
        run: |
          cd zig-out
          find docs -type d | while read -r directory; do
            curl \
              -u "${{ secrets.ARTIFACT_UPLOAD_USER }}:${{ secrets.ARTIFACT_UPLOAD_PASSWORD }}" \
              -F "mkdir=${directory}" \
              "https://files.kiesel.dev/upload?path=/"
          done
          find docs -type f | while read -r file; do
            curl \
              -u "${{ secrets.ARTIFACT_UPLOAD_USER }}:${{ secrets.ARTIFACT_UPLOAD_PASSWORD }}" \
              -F "path=@${file}" \
              "https://files.kiesel.dev/upload?path=/$(dirname $file)"
          done

  lint:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Check formatting
        run: |
          zig fmt --check .
      - name: Check for unused imports
        run: |
          git clone https://github.com/tusharsadhwani/zigimports
          cd zigimports
          git checkout cd67cc8bc2595d963e89ead6a20f86168c84739a
          zig build --release=safe
          "./zig-out/bin/zigimports-$(uname -m)-linux" ..

  test:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Run tests
        run: |
          zig build -Denable-intl=false -Denable-temporal=false test
      - name: Ensure test expectations are up to date
        run: |
          zig build -Denable-intl=false -Denable-temporal=false update-expectations
          git diff --exit-code -- src/interpreter/test_cases.zon
      - name: Build fuzzilli shell
        run: |
          # This doesn't run anything, only make sure it keeps building
          zig build -Denable-intl=false -Denable-temporal=false fuzzilli

  test262:
    runs-on: meow
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    env:
      # Re-generate `tools/test262/results.json` when updating this
      TEST262_COMMIT: be13516fb6441b950ba8a3df97eb34062c186972
    steps:
      - name: Check out Kiesel
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out test262
        run: |
          # NOTE: We can't do this with actions/checkout since it assumes the repo is also on codeberg.org
          git clone https://github.com/tc39/test262
          cd test262
          git checkout $TEST262_COMMIT
      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install Node.js
        uses: https://github.com/actions/setup-node@v6
      - name: Install dependencies
        run: |
          # NOTE: jq is already installed in the Docker image
          npm install -g git+https://codeberg.org/kiesel-js/test262-harness-fork.git
      - name: Build Kiesel
        run: |
          zig build -Doptimize=safe
      - name: Run test262
        run: |
          ./tools/test262/generate-results.sh ./zig-out/bin/kiesel ./test262 'test/**/*.js' > ./tools/test262/results-new.json
      - name: Compare results
        run: |
          diff -u ./tools/test262/results.json ./tools/test262/results-new.json
